      <h2>洛阳城市情绪寓言</h2>
      <p>
        《猫游洛阳》不是普通旅游号，也不是普通AI萌宠号。
        它用一只洛阳小猫的视角，记录这座城市的地标、街巷、烟火气和普通人的心事。
      </p>
    </section>

    <section>
      <h2>核心角色</h2>
      <ul>
        <li><strong>橘小洛：</strong>善良、慢、真、克制的小橘猫。</li>
        <li><strong>小灰：</strong>橘小洛心里的焦虑、急躁和不甘。</li>
        <li><strong>甄云漪：</strong>来自洛神赋意象的文化回声。</li>
      </ul>
    </section>

    <section>
      <h2>项目方向</h2>
      <p>
        AI动画、实拍猫爪、洛阳导览、城市治愈文章、小游戏、文创与本地店铺联动。
      </p>
